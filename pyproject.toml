[project]
name = "track01-student-kit"
version = "1.0.0"
description = "Track 01 Google Maps for Every Building: starter agent and scorer"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "sqlmodel>=0.0.48",
    "trimesh>=5.2.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starter_agent", "benchmark", "core", "agent", "server", "capture"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
